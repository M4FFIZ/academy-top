# Скопируйте в корень репозитория как amvera.yml на ветке deploy-api
meta:
  environment: node
  toolchain:
    name: npm
    version: "22"

build:
  additionalCommands: npm run db:generate && npm run build -w @academy-top/api

run:
  command: sh -c "npm run db:push && npm run db:seed && npm run start -w @academy-top/api"
  containerPort: 3001
